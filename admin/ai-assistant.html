<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Logistics Assistant - Smart Insights & Analytics">
  <title>AI Assistant — CrownPrevail Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/admin.css">
  <style>
    .ai-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; height: calc(100vh - 120px); margin-bottom: 0; }
    .chat-area { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .chat-input-area { padding: 16px; border-top: 1px solid #eee; display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .chat-input-area button { background: #a68f50; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; z-index: 10; position: relative; }
    .chat-input-area button:hover { background: #8b7240; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .chat-input-area button:active { transform: translateY(0); }
    .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; animation: slideIn 0.3s ease-out; }
    .message.user { align-self: flex-end; background: #a68f50; color: #fff; text-align: right; }
    .message.ai { align-self: flex-start; background: #f0f0f0; color: #333; border-left: 3px solid #a68f50; }
    .message.system { align-self: center; background: #e3f2fd; color: #1565c0; font-size: 13px; text-align: center; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message strong { display: block; margin-bottom: 4px; }
    .message code { background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
    .quick-prompts { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .quick-prompts h4 { margin: 0 0 12px; font-size: 12px; color: #666; text-transform: uppercase; font-weight: 700; }
    .quick-prompt { background: #f9f9f9; border: 1px solid #eee; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; text-align: left; }
    .quick-prompt:hover { background: #f0f0f0; border-color: #a68f50; }
    .quick-prompt i { margin-right: 6px; color: #a68f50; }
    .typing-indicator { display: flex; gap: 4px; }
    .typing-indicator span { width: 6px; height: 6px; background: #999; border-radius: 50%; animation: typing 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
    @media (max-width: 1024px) {
      .ai-container { grid-template-columns: 1fr; }
      .quick-prompts { display: none; }
    }
    @media (max-width: 768px) {
      .ai-container { height: auto; min-height: 60vh; }
      .chat-messages { max-height: 400px; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/assets/images/logo/logo%20plain%20background.png" alt="CrownPrevail">
        <p class="brand-name">CrownPrevail</p>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
        <a href="blogs.html" class="nav-link">
          <i class="fas fa-blog"></i>
          <span>Blog Posts</span>
        </a>
        <a href="team.html" class="nav-link">
          <i class="fas fa-users"></i>
          <span>Team</span>
        </a>
        <a href="inquiries.html" class="nav-link">
          <i class="fas fa-envelope"></i>
          <span>Inquiries</span>
        </a>
        <a href="analytics.html" class="nav-link">
          <i class="fas fa-bar-chart"></i>
          <span>Analytics</span>
        </a>
        <a href="financials.html" class="nav-link">
          <i class="fas fa-wallet"></i>
          <span>Financials</span>
        </a>
        <a href="invoices.html" class="nav-link">
          <i class="fas fa-file-invoice"></i>
          <span>Invoices</span>
        </a>
        <a href="ai-assistant.html" class="nav-link active">
          <i class="fas fa-robot"></i>
          <span>AI Assistant</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="profile.html" class="nav-link">
          <i class="fas fa-user-circle"></i>
          <span>Profile</span>
        </a>
        <a href="#" id="logout-btn" class="nav-link">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar" style="margin-bottom: 16px;">
        <h2><i class="fas fa-robot"></i> AI Logistics Assistant</h2>
      </div>

      <div class="ai-container">
        <!-- Chat Area -->
        <div class="chat-area">
          <div class="chat-messages" id="chat-messages">
            <div class="message system">
              <strong>🤖 AI Assistant Ready</strong><br>
              Ask me anything about your logistics operations!
            </div>
          </div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask me about invoices, financials, shipments...">
            <button id="send-btn" type="button" style="cursor: pointer;"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>

        <!-- Quick Prompts -->
        <div class="quick-prompts">
          <h4>💡 Quick Prompts</h4>
          <button class="quick-prompt" onclick="quickPrompt('How many invoices did I create this month?')">
            <i class="fas fa-file-invoice"></i> Monthly Invoices
          </button>
          <button class="quick-prompt" onclick="quickPrompt('What\\'s my total income and expenses this week?')">
            <i class="fas fa-wallet"></i> Weekly Finance
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Analyze my logistics performance and suggest improvements')">
            <i class="fas fa-chart-line"></i> Performance
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Forecast my expenses for next month based on trends')">
            <i class="fas fa-crystal-ball"></i> Forecast
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Generate a summary of all pending shipments')">
            <i class="fas fa-box"></i> Shipments
          </button>
          <button class="quick-prompt" onclick="quickPrompt('What are my top 3 most profitable services?')">
            <i class="fas fa-star"></i> Top Services
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Create a professional report for stakeholders')">
            <i class="fas fa-file-pdf"></i> Report
          </button>
          <button class="quick-prompt" onclick="clearChat()">
            <i class="fas fa-trash"></i> Clear Chat
          </button>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, logoutAdmin } from './assets/admin.js';
    import { ToastManager, aiApiHandler } from './assets/utils.js';
    import { geminiConfig } from './assets/config.js';

    const toastManager = new ToastManager();
    let conversationHistory = [];

    // Initialize
    async function init() {
      requireAuth();
      checkApiKeyStatus();
      setupEventListeners();
      loadConversationHistory();
    }

    function checkApiKeyStatus() {
      if (!aiApiHandler.hasAvailableKey()) {
        displayMessage('system', '⚠️ Warning: No API keys configured');
        displayMessage('system', 'Add VITE_OPENROUTER_API_KEY or VITE_GEMINI_API_KEY to .env file for AI features');
      }
    }

    function setupEventListeners() {
      const sendBtn = document.getElementById('send-btn');
      console.log('Send button:', sendBtn);
      if (sendBtn) {
        sendBtn.addEventListener('click', (e) => {
          console.log('Send button clicked!');
          e.preventDefault();
          sendMessage();
        });
      }
      document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });
      document.getElementById('logout-btn').addEventListener('click', logoutAdmin);
    }

    function loadConversationHistory() {
      const saved = localStorage.getItem('ai_conversation');
      conversationHistory = saved ? JSON.parse(saved) : [];
      conversationHistory.forEach(msg => displayMessage(msg.role, msg.content));
    }

    function saveConversationHistory() {
      localStorage.setItem('ai_conversation', JSON.stringify(conversationHistory));
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();

      if (!message) return;

      input.value = '';
      displayMessage('user', message);
      conversationHistory.push({ role: 'user', content: message });

      showTypingIndicator();

      try {
        const result = await aiApiHandler.generateResponse(message, conversationHistory);

        if (result.success) {
          displayMessage('ai', result.response);
          conversationHistory.push({ role: 'assistant', content: result.response });
          saveConversationHistory();
          if (result.provider === 'Gemini') {
            displayMessage('system', `💡 Response from Gemini API`);
          }
        } else {
          throw new Error(result.error);
        }
      } catch (err) {
        console.error('AI Error:', err);
        displayMessage('system', '❌ Error: ' + (err.message || 'Failed to get response'));
        displayMessage('system', 'Try again or add API keys to .env file.');
      }
    }

    function displayMessage(role, content) {
      const messagesDiv = document.getElementById('chat-messages');
      
      // Remove typing indicator
      const typingDiv = messagesDiv.querySelector('.typing-indicator')?.parentElement;
      if (typingDiv) typingDiv.remove();

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.textContent = content;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTypingIndicator() {
      const messagesDiv = document.getElementById('chat-messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ai';
      typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    window.quickPrompt = function(prompt) {
      document.getElementById('chat-input').value = prompt;
      sendMessage();
    };

    window.clearChat = function() {
      if (confirm('Clear chat history?')) {
        conversationHistory = [];
        localStorage.removeItem('ai_conversation');
        document.getElementById('chat-messages').innerHTML = `
          <div class="message system">
            <strong>🤖 AI Assistant Ready</strong><br>
            Ask me anything about your logistics operations!
          </div>
        `;
        toastManager.success('Chat cleared');
      }
    };

    init();
  </script>
</body>
</html>
