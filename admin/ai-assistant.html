<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Logistics Assistant - Smart Insights & Analytics">
  <title>AI Assistant — CrownPrevail Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/admin.css">
  <style>
    .ai-container { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; height: calc(100vh - 120px); margin-bottom: 0; }
    .chat-area { background: linear-gradient(180deg, #ffffff 0%, #f9f9f8 100%); border: 1px solid rgba(22, 35, 61, 0.06); border-radius: 18px; box-shadow: 0 18px 32px rgba(15, 23, 42, 0.08); display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, rgba(245, 245, 244, 0.8), rgba(255,255,255,0.95)); }
    .chat-input-area { padding: 16px 18px; border-top: 1px solid rgba(22,35,61,0.06); display: flex; gap: 12px; background: rgba(255,255,255,0.9); }
    .chat-input-area input { flex: 1; padding: 14px 16px; border: 1px solid rgba(22,35,61,0.12); border-radius: 12px; font-size: 14px; background: #fff; color: #1d2433; box-shadow: inset 0 1px 2px rgba(0,0,0,0.04); }
    .chat-input-area input:focus { outline: none; border-color: rgba(166, 143, 80, 0.8); box-shadow: 0 0 0 4px rgba(166,143,80,0.12); }
    .chat-input-area button { background: linear-gradient(135deg, #a68f50, #c9af6f); color: #fff; border: none; padding: 12px 18px; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.2s; min-width: 52px; box-shadow: 0 10px 20px rgba(166,143,80,0.22); }
    .chat-input-area button:hover { background: linear-gradient(135deg, #937e45, #b89a52); transform: translateY(-2px); box-shadow: 0 12px 24px rgba(166,143,80,0.26); }
    .chat-input-area button:active { transform: translateY(0); }
    .message { padding: 12px 14px; border-radius: 18px; max-width: min(80%, 680px); animation: slideIn 0.25s ease-out; line-height: 1.6; word-break: break-word; white-space: pre-wrap; box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06); }
    .message.user { align-self: flex-end; background: linear-gradient(135deg, #1d2d4f, #2b4468); color: #fff; border-bottom-right-radius: 8px; }
    .message.ai { align-self: flex-start; background: #ffffff; color: #1d2433; border-left: 4px solid #a68f50; border-bottom-left-radius: 8px; }
    .message.system { align-self: center; background: #edf6ff; color: #12589b; font-size: 13px; text-align: center; border-radius: 999px; padding: 10px 14px; box-shadow: none; max-width: 90%; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message strong { display: block; margin-bottom: 4px; }
    .message code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    .quick-prompts { background: #fff; border: 1px solid rgba(22,35,61,0.06); border-radius: 18px; padding: 16px; box-shadow: 0 18px 32px rgba(15, 23, 42, 0.06); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .quick-prompts h4 { margin: 0 0 12px; font-size: 12px; color: #666; text-transform: uppercase; font-weight: 700; }
    .quick-prompt { background: #f9f9f9; border: 1px solid #eee; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; text-align: left; }
    .quick-prompt:hover { background: #f0f0f0; border-color: #a68f50; }
    .quick-prompt i { margin-right: 6px; color: #a68f50; }
    .typing-indicator { display: flex; gap: 4px; }
    .typing-indicator span { width: 6px; height: 6px; background: #999; border-radius: 50%; animation: typing 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
    /* Markdown output styling for AI answers */
    .message.ai { white-space: normal; }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }
    .md-p { margin: 6px 0; }
    .md-h { font-weight: 700; font-size: 14px; color: #1a2e4a; margin: 12px 0 6px; letter-spacing: 0.2px; }
    .md-h:first-child { margin-top: 0; color: #8b7240; }
    .md-list { margin: 6px 0 8px; padding-left: 20px; }
    .md-list li { margin: 4px 0; }
    .md-list li::marker { color: #a68f50; }
    .message.ai strong { display: inline; margin-bottom: 0; color: #1a2e4a; }
    .message.ai em { color: #555; }
    .md-pre { background: #f5f4f0; border: 1px solid #e8e5dc; border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
    .md-pre code { background: none; padding: 0; font-size: 12px; line-height: 1.5; }
    .md a { color: #2b6cb0; text-decoration: underline; }
    .md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%; }
    .md th, .md td { border: 1px solid #e5e2d9; padding: 6px 10px; text-align: left; }
    .md th { background: #f7f6f2; color: #1a2e4a; }
    @media (max-width: 1024px) {
      .ai-container { grid-template-columns: 1fr; }
      .quick-prompts { display: none; }
    }
    @media (max-width: 768px) {
      .ai-container { height: auto; min-height: 60vh; }
      .chat-messages { max-height: 400px; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/assets/images/logo/logo%20plain%20background.png" alt="CrownPrevail">
        <p class="brand-name">CrownPrevail</p>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
        <a href="blogs.html" class="nav-link">
          <i class="fas fa-blog"></i>
          <span>Blog Posts</span>
        </a>
        <a href="team.html" class="nav-link">
          <i class="fas fa-users"></i>
          <span>Team</span>
        </a>
        <a href="inquiries.html" class="nav-link">
          <i class="fas fa-envelope"></i>
          <span>Inquiries</span>
        </a>
        <a href="analytics.html" class="nav-link">
          <i class="fas fa-bar-chart"></i>
          <span>Analytics</span>
        </a>
        <a href="financials.html" class="nav-link">
          <i class="fas fa-wallet"></i>
          <span>Financials</span>
        </a>
        <a href="invoices.html" class="nav-link">
          <i class="fas fa-file-invoice"></i>
          <span>Invoices</span>
        </a>
        <a href="ai-assistant.html" class="nav-link active">
          <i class="fas fa-robot"></i>
          <span>AI Assistant</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="profile.html" class="nav-link">
          <i class="fas fa-user-circle"></i>
          <span>Profile</span>
        </a>
        <a href="#" id="logout-btn" class="nav-link">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar" style="margin-bottom: 16px;">
        <h2><i class="fas fa-robot"></i> AI Logistics Assistant</h2>
      </div>

      <div class="ai-container">
        <!-- Chat Area -->
        <div class="chat-area">
          <div class="chat-messages" id="chat-messages">
            <div class="message system">
              <strong>🤖 AI Assistant Ready</strong><br>
              Ask me anything about your logistics operations!
            </div>
          </div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask me about invoices, financials, shipments...">
            <button id="send-btn" type="button" style="cursor: pointer;"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>

        <!-- Quick Prompts -->
        <div class="quick-prompts">
          <h4>💡 Quick Prompts</h4>
          <button class="quick-prompt" onclick="quickPrompt('How many invoices did I create this month?')">
            <i class="fas fa-file-invoice"></i> Monthly Invoices
          </button>
          <button class="quick-prompt" onclick="quickPrompt('What’s my total income and expenses this week?')">
            <i class="fas fa-wallet"></i> Weekly Finance
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Analyze my logistics performance and suggest improvements')">
            <i class="fas fa-chart-line"></i> Performance
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Forecast my expenses for next month based on trends')">
            <i class="fas fa-crystal-ball"></i> Forecast
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Generate a summary of all pending shipments')">
            <i class="fas fa-box"></i> Shipments
          </button>
          <button class="quick-prompt" onclick="quickPrompt('What are my top 3 most profitable services?')">
            <i class="fas fa-star"></i> Top Services
          </button>
          <button class="quick-prompt" onclick="quickPrompt('Create a professional report for stakeholders')">
            <i class="fas fa-file-pdf"></i> Report
          </button>
          <button class="quick-prompt" onclick="clearChat()">
            <i class="fas fa-trash"></i> Clear Chat
          </button>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, logoutAdmin, askAI } from './assets/admin.js';
    import { ToastManager, aiApiHandler, renderMarkdown } from './assets/utils.js';
    import { aiProxyConfig } from './assets/config.js';

    const toastManager = new ToastManager();
    let conversationHistory = [];

    // Initialize
    async function init() {
      await requireAuth();
      checkApiKeyStatus();
      setupEventListeners();
      loadConversationHistory();
    }

    function checkApiKeyStatus() {
      if (!aiProxyConfig.url && !aiApiHandler.hasAvailableKey()) {
        displayMessage('system', '⚠️ Warning: No AI provider configured');
        displayMessage('system', 'Deploy the aiProxy Cloud Function and set VITE_AI_PROXY_URL, or add API keys to .env for AI features');
      }
    }

    function setupEventListeners() {
      const sendBtn = document.getElementById('send-btn');
      console.log('Send button:', sendBtn);
      if (sendBtn) {
        sendBtn.addEventListener('click', (e) => {
          console.log('Send button clicked!');
          e.preventDefault();
          sendMessage();
        });
      }
      document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });
      document.getElementById('logout-btn').addEventListener('click', logoutAdmin);
    }

    function loadConversationHistory() {
      const saved = localStorage.getItem('ai_conversation');
      conversationHistory = saved ? JSON.parse(saved) : [];
      conversationHistory.forEach(msg => displayMessage(msg.role, msg.content));
    }

    function saveConversationHistory() {
      localStorage.setItem('ai_conversation', JSON.stringify(conversationHistory));
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();

      if (!message) return;

      input.value = '';
      displayMessage('user', message);
      conversationHistory.push({ role: 'user', content: message });

      showTypingIndicator();

      try {
        const result = await askAI(message, conversationHistory.slice(-10));

        if (result.success) {
          displayMessage('ai', result.response);
          conversationHistory.push({ role: 'assistant', content: result.response });
          saveConversationHistory();
          if (result.provider === 'Gemini') {
            displayMessage('system', `💡 Response from Gemini API`);
          }
        } else {
          throw new Error(result.error);
        }
      } catch (err) {
        console.error('AI Error:', err);
        displayMessage('system', '❌ Error: ' + (err.message || 'Failed to get response'));
        displayMessage('system', 'Try again or configure the AI provider.');
      }
    }

    function displayMessage(role, content) {
      const messagesDiv = document.getElementById('chat-messages');
      
      // Remove typing indicator
      const typingDiv = messagesDiv.querySelector('.typing-indicator')?.parentElement;
      if (typingDiv) typingDiv.remove();

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      if (role === 'ai') {
        // Safe markdown subset → formatted HTML (escaped inside renderMarkdown)
        msgDiv.innerHTML = `<div class="md">${renderMarkdown(content)}</div>`;
      } else {
        msgDiv.textContent = content;
      }
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTypingIndicator() {
      const messagesDiv = document.getElementById('chat-messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ai';
      typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    window.quickPrompt = function(prompt) {
      document.getElementById('chat-input').value = prompt;
      sendMessage();
    };

    window.clearChat = function() {
      if (confirm('Clear chat history?')) {
        conversationHistory = [];
        localStorage.removeItem('ai_conversation');
        document.getElementById('chat-messages').innerHTML = `
          <div class="message system">
            <strong>🤖 AI Assistant Ready</strong><br>
            Ask me anything about your logistics operations!
          </div>
        `;
        toastManager.success('Chat cleared');
      }
    };

    init();
  </script>
</body>
</html>
