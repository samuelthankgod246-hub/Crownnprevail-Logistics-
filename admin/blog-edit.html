<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Blog Post — CrownPrevail Admin</title>
  <link rel="stylesheet" href="assets/admin.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../assets/images/logo/logo plain background.png" alt="CrownPrevail">
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">📊</span><span>Dashboard</span></a>
        <a href="blogs.html" class="active"><span class="icon">📝</span><span>Blog Posts</span></a>
        <a href="inquiries.html"><span class="icon">✉️</span><span>Inquiries</span></a>
        <a href="team.html"><span class="icon">👥</span><span>Team</span></a>
        <a href="analytics.html"><span class="icon">📈</span><span>Analytics</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank"><span class="icon">🌐</span><span>View Site</span></a>
        <a href="#" id="logout-link"><span class="icon">🚪</span><span>Sign Out</span></a>
      </div>
    </aside>

    <main class="main-content" id="admin-content">
      <div class="breadcrumb">
        <a href="blogs.html">Blog Posts</a> <span>/</span> <span id="page-title">New Post</span>
      </div>

      <div class="card form-card">
        <div class="card-header">
          <h3 id="form-title">Create New Post</h3>
        </div>
        <div class="card-body">
          <div id="alert-message" class="alert"></div>
          <form id="blog-form">
            <div class="form-row">
              <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Post title" required>
              </div>
              <div class="form-group">
                <label for="slug">Slug</label>
                <input type="text" id="slug" placeholder="post-title-slug">
                <div class="hint">Leave empty to auto-generate from title</div>
              </div>
            </div>

            <div class="form-row-3">
              <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" placeholder="Author name">
              </div>
              <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" placeholder="e.g. Logistics, News">
              </div>
              <div class="form-group">
                <label for="image">Featured Image URL</label>
                <input type="text" id="image" placeholder="https://example.com/image.jpg">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="excerpt">Excerpt / Short Description</label>
                <textarea id="excerpt" rows="3" placeholder="Brief summary of the post..."></textarea>
              </div>
              <div class="form-group">
                <label>Publish Status</label>
                <div style="padding-top:8px;">
                  <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;">
                    <input type="checkbox" id="published" checked> Published
                  </label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="editor">Content</label>
              <div id="editor"></div>
            </div>

            <div class="form-actions">
              <a href="blogs.html" class="btn btn-outline">Cancel</a>
              <button type="submit" id="save-btn" class="btn btn-gold" style="width:auto;">Save Post</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script type="module">
    import { requireAuth, getDocument, addDocument, updateDocument, slugify, logoutAdmin } from './assets/admin.js';
    requireAuth();

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      logoutAdmin();
    });

    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ header: [1,2,3,false] }],
          ['bold','italic','underline','strike'],
          [{ list:'ordered'},{ list:'bullet' }],
          ['blockquote','code-block'],
          [{ align: [] }],
          ['link','image'],
          ['clean']
        ]
      },
      placeholder: 'Write your blog content here...'
    });

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    const form = document.getElementById('blog-form');
    const saveBtn = document.getElementById('save-btn');
    const alertEl = document.getElementById('alert-message');

    if (postId) {
      document.getElementById('page-title').textContent = 'Edit Post';
      document.getElementById('form-title').textContent = 'Edit Blog Post';
      saveBtn.textContent = 'Update Post';
      loadPost(postId);
    }

    async function loadPost(id) {
      const post = await getDocument('blog_posts', id);
      if (!post) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = 'Post not found.';
        alertEl.style.display = 'block';
        return;
      }
      document.getElementById('title').value = post.title || '';
      document.getElementById('slug').value = post.slug || '';
      document.getElementById('author').value = post.author || '';
      document.getElementById('category').value = post.category || '';
      document.getElementById('image').value = post.image || '';
      document.getElementById('excerpt').value = post.excerpt || '';
      document.getElementById('published').checked = post.published !== false;
      if (post.content) {
        quill.root.innerHTML = post.content;
      }
    }

    document.getElementById('title').addEventListener('input', function() {
      const slugField = document.getElementById('slug');
      if (!slugField.dataset.manual) {
        slugField.value = slugify(this.value);
      }
    });

    document.getElementById('slug').addEventListener('input', function() {
      this.dataset.manual = this.value.length > 0;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = postId ? 'Updating...' : 'Saving...';
      alertEl.className = 'alert';
      alertEl.style.display = 'none';

      const data = {
        title: document.getElementById('title').value.trim(),
        slug: document.getElementById('slug').value.trim() || slugify(document.getElementById('title').value.trim()),
        author: document.getElementById('author').value.trim() || 'Admin',
        category: document.getElementById('category').value.trim() || 'General',
        image: document.getElementById('image').value.trim(),
        excerpt: document.getElementById('excerpt').value.trim(),
        content: quill.root.innerHTML,
        published: document.getElementById('published').checked
      };

      let result;
      if (postId) {
        result = await updateDocument('blog_posts', postId, data);
      } else {
        result = await addDocument('blog_posts', data);
      }

      if (result.success) {
        alertEl.className = 'alert alert-success';
        alertEl.textContent = postId ? 'Post updated successfully!' : 'Post created successfully!';
        alertEl.style.display = 'block';
        if (!postId) {
          setTimeout(() => window.location.href = 'blogs.html', 1500);
        }
      } else {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = 'Error: ' + result.error;
        alertEl.style.display = 'block';
        saveBtn.disabled = false;
        saveBtn.textContent = postId ? 'Update Post' : 'Save Post';
      }
    });
  </script>
</body>
</html>
