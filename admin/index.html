<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CrownPrevail Logistics - Admin Login">
  <title>Admin Login — CrownPrevail Logistics</title>
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo">
      <img src="../assets/images/logo/logo plain background.png" alt="CrownPrevail Logo">
    </div>
    <h1>Admin Login</h1>
    <p>Sign in to manage your logistics website</p>
    <div id="alert-message" class="alert"></div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="admin@crownprevail.com" required autocomplete="email" aria-label="Email Address">
        <div class="error-message"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" aria-label="Password">
        <div class="error-message"></div>
      </div>
      <button type="submit" id="login-btn" class="btn btn-gold" aria-busy="false">
        <i class="fas fa-sign-in-alt" style="display:none;" id="spinner"></i>
        <span id="btn-text">Sign In</span>
      </button>
    </form>
    <p style="margin-top:24px;text-align:center;font-size:12px;color:#999;">
      <a href="../index.html" style="color:#a68f50; transition: 0.15s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">← Back to Website</a>
    </p>
  </div>

  <script type="module">
    import { loginAdmin } from './assets/admin.js';
    import { FormValidator, validators } from './assets/utils.js';

    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const alertEl = document.getElementById('alert-message');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btn-text');

    const validator = new FormValidator(form);
    validator.addField('email', [validators.required, validators.email]);
    validator.addField('password', [validators.required, validators.minLength(6)]);

    // Real-time validation
    form.querySelectorAll('input').forEach(input => {
      input.addEventListener('blur', () => {
        const result = validator.validateField(input.name, input.value);
        const formGroup = input.closest('.form-group');
        if (!result.valid) {
          formGroup.classList.add('has-error');
          const errorMsg = formGroup.querySelector('.error-message');
          errorMsg.textContent = result.message;
        }
      });

      input.addEventListener('input', () => {
        validator.clearFieldError(input.name);
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const validation = validator.validate();
      if (!validation.valid) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      spinner.style.display = 'inline-block';
      spinner.classList.add('fa-spinner');
      spinner.classList.add('fa-spin');
      btnText.textContent = 'Signing in...';
      alertEl.className = 'alert';
      alertEl.style.display = 'none';

      const result = await loginAdmin(email, password);

      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        alertEl.className = 'alert alert-error show';
        alertEl.textContent = result.error;
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
        spinner.style.display = 'none';
        spinner.classList.remove('fa-spinner', 'fa-spin');
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
