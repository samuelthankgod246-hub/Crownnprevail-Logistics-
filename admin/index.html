<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CrownPrevail Logistics</title>
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo">
      <img src="../assets/images/logo/logo plain background.png" alt="CrownPrevail">
    </div>
    <h1>Admin Login</h1>
    <p>Sign in to manage your logistics website</p>
    <div id="alert-message" class="alert"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@crownprevail.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" id="login-btn" class="btn btn-gold">Sign In</button>
    </form>
    <p style="margin-top:24px;text-align:center;font-size:12px;color:#999;">
      <a href="../index.html" style="color:#a68f50;">← Back to Website</a>
    </p>
  </div>

  <script type="module">
    import { loginAdmin } from './assets/admin.js';

    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const alertEl = document.getElementById('alert-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      alertEl.className = 'alert';
      alertEl.style.display = 'none';

      const result = await loginAdmin(email, password);

      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = result.error;
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
