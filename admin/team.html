<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage team members in CrownPrevail admin dashboard">
  <title>Team — CrownPrevail Admin</title>
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/assets/images/logo/logo%20plain%20background.png" alt="CrownPrevail">
        <p class="brand-name">CrownPrevail</p>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" aria-label="Dashboard"><span class="icon"><i class="fas fa-chart-line"></i></span><span>Dashboard</span></a>
        <a href="blogs.html" aria-label="Blog Posts"><span class="icon"><i class="fas fa-pen-fancy"></i></span><span>Blog Posts</span></a>
        <a href="inquiries.html" aria-label="Inquiries"><span class="icon"><i class="fas fa-envelope"></i></span><span>Inquiries</span></a>
        <a href="team.html" class="active" aria-label="Team"><span class="icon"><i class="fas fa-users"></i></span><span>Team</span></a>
        <a href="analytics.html" aria-label="Analytics"><span class="icon"><i class="fas fa-chart-bar"></i></span><span>Analytics</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank" aria-label="View Website"><span class="icon"><i class="fas fa-globe"></i></span><span>View Site</span></a>
        <a href="#" id="logout-link" aria-label="Sign Out"><span class="icon"><i class="fas fa-sign-out-alt"></i></span><span>Sign Out</span></a>
      </div>
    </aside>

    <main class="main-content" id="admin-content">
      <div class="top-bar">
        <h2>Team Members</h2>
        <button class="btn btn-gold" style="width:auto;" id="add-member-btn"><i class="fas fa-plus"></i> Add Member</button>
      </div>

      <div id="alert-message" class="alert"></div>

      <div class="card">
        <div class="card-header">
          <h3>Team Roster</h3>
          <input type="text" id="search-input" placeholder="Search members..." style="padding: 8px 12px; border: 1.5px solid #dde1e6; border-radius: 6px; font-size: 13px; width: 250px;">
        </div>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="sort-header" data-field="order">Order</th>
                  <th class="sort-header" data-field="name">Name</th>
                  <th class="sort-header" data-field="title">Title</th>
                  <th>Image</th>
                  <th style="width: 180px;">Actions</th>
                </tr>
              </thead>
              <tbody id="team-tbody">
                <tr><td colspan="5" class="loading"><div class="spinner" style="margin:0 auto 8px;"></div>Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Edit Modal -->
      <div class="modal-overlay" id="team-modal">
        <div class="modal">
          <h3 id="modal-title">Add Team Member</h3>
          <form id="team-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="tm-name">Full Name</label>
                <input type="text" id="tm-name" name="name" required>
                <div class="error-message"></div>
              </div>
              <div class="form-group">
                <label for="tm-title">Title / Position</label>
                <input type="text" id="tm-title" name="title" required>
                <div class="error-message"></div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="tm-image">Image Path</label>
                <input type="text" id="tm-image" name="image" placeholder="assets/team/name.jpg">
                <div class="hint">Relative path to image file</div>
                <div class="error-message"></div>
              </div>
              <div class="form-group">
                <label for="tm-order">Display Order</label>
                <input type="number" id="tm-order" name="order" value="0" min="0">
                <div class="error-message"></div>
              </div>
            </div>

            <div class="form-group">
              <label for="tm-bio">Bio</label>
              <textarea id="tm-bio" name="bio" rows="3" placeholder="Brief biography..." maxlength="500"></textarea>
              <div class="hint" id="bio-count">0 / 500 characters</div>
              <div class="error-message"></div>
            </div>

            <div class="form-actions" style="border:none;padding:0;margin-top:20px;">
              <button type="button" class="btn btn-outline" id="modal-cancel-btn"><i class="fas fa-times"></i> Cancel</button>
              <button type="submit" class="btn btn-gold" style="width:auto;" id="modal-save-btn"><i class="fas fa-save"></i> Save</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, getCollection, addDocument, updateDocument, deleteDocument, logoutAdmin, formatDate } from './assets/admin.js';
    import { toastManager, FormValidator, validators, debounce, showLoadingSkeleton } from './assets/utils.js';
    
    requireAuth();

    // Logout handler
    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm('Are you sure you want to sign out?')) {
        logoutAdmin();
      }
    });

    const tbody = document.getElementById('team-tbody');
    const modal = document.getElementById('team-modal');
    const modalTitle = document.getElementById('modal-title');
    const teamForm = document.getElementById('team-form');
    const saveBtn = document.getElementById('modal-save-btn');
    const cancelBtn = document.getElementById('modal-cancel-btn');
    const searchInput = document.getElementById('search-input');
    const bioCount = document.getElementById('bio-count');
    
    let editId = null;
    let allMembers = [];
    let currentPage = 1;
    const itemsPerPage = 10;

    // Form validation
    const validator = new FormValidator(teamForm);
    validator.addField('name', [validators.required, validators.minLength(2)]);
    validator.addField('title', [validators.required, validators.minLength(2)]);
    validator.addField('bio', [validators.maxLength(500)]);

    // Bio character counter
    document.getElementById('tm-bio').addEventListener('input', (e) => {
      const count = e.target.value.length;
      bioCount.textContent = `${count} / 500 characters`;
    });

    // Sorting
    document.querySelectorAll('.sort-header').forEach(header => {
      header.addEventListener('click', () => {
        const field = header.dataset.field;
        const isAsc = header.classList.contains('asc');
        document.querySelectorAll('.sort-header').forEach(h => {
          h.classList.remove('asc', 'desc');
        });
        header.classList.add(isAsc ? 'desc' : 'asc');
        allMembers.sort((a, b) => {
          let aVal = a[field];
          let bVal = b[field];
          if (typeof aVal === 'string') {
            aVal = aVal.toLowerCase();
            bVal = bVal.toLowerCase();
          }
          return isAsc ? (bVal > aVal ? 1 : -1) : (aVal > bVal ? 1 : -1);
        });
        currentPage = 1;
        renderTable();
      });
    });

    // Search with debounce
    searchInput.addEventListener('input', debounce((e) => {
      const query = e.target.value.toLowerCase();
      if (!query) {
        renderTable(allMembers);
        return;
      }
      const filtered = allMembers.filter(m =>
        m.name.toLowerCase().includes(query) ||
        m.title.toLowerCase().includes(query) ||
        (m.bio && m.bio.toLowerCase().includes(query))
      );
      currentPage = 1;
      renderTable(filtered);
    }, 300));

    function renderTable(data = allMembers) {
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedData = data.slice(start, end);

      if (paginatedData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:40px;"><i class="fas fa-users" style="font-size: 48px; opacity: 0.2; display: block; margin-bottom: 16px;"></i>No team members found.</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      tbody.innerHTML = paginatedData.map(m => `
        <tr>
          <td><strong>${m.order ?? '—'}</strong></td>
          <td><strong>${m.name}</strong></td>
          <td>${m.title}</td>
          <td style="font-size:12px;color:#888;" title="${m.image || 'No image'}">${m.image ? m.image.substring(0, 30) + '...' : '—'}</td>
          <td>
            <div class="actions">
              <button class="btn btn-sm btn-outline edit-btn" data-id="${m.id}" title="Edit"><i class="fas fa-edit"></i> Edit</button>
              <button class="btn btn-sm btn-danger delete-btn" data-id="${m.id}" title="Delete"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');

      // Render pagination
      const totalPages = Math.ceil(data.length / itemsPerPage);
      let paginationHtml = '';
      for (let i = 1; i <= totalPages; i++) {
        paginationHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      document.getElementById('pagination').innerHTML = paginationHtml;

      document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentPage = parseInt(btn.dataset.page);
          renderTable(data);
        });
      });

      // Event listeners
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const member = allMembers.find(m => m.id === btn.dataset.id);
          if (member) openEdit(member);
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const member = allMembers.find(m => m.id === btn.dataset.id);
          if (member && confirm(`Delete "${member.name}"? This cannot be undone.`)) {
            await deleteDocument('team_members', btn.dataset.id);
            await loadTeam();
          }
        });
      });
    }

    function openEdit(member) {
      editId = member.id || null;
      modalTitle.textContent = editId ? 'Edit Team Member' : 'Add Team Member';
      saveBtn.innerHTML = editId ? '<i class="fas fa-save"></i> Update' : '<i class="fas fa-save"></i> Save';
      document.getElementById('tm-name').value = member.name || '';
      document.getElementById('tm-title').value = member.title || '';
      document.getElementById('tm-image').value = member.image || '';
      document.getElementById('tm-order').value = member.order || '0';
      document.getElementById('tm-bio').value = member.bio || '';
      bioCount.textContent = `${(member.bio || '').length} / 500 characters`;
      validator.reset();
      modal.classList.add('show');
    }

    document.getElementById('add-member-btn').addEventListener('click', () => {
      editId = null;
      modalTitle.textContent = 'Add Team Member';
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Save';
      teamForm.reset();
      document.getElementById('tm-order').value = '0';
      bioCount.textContent = '0 / 500 characters';
      validator.reset();
      modal.classList.add('show');
    });

    cancelBtn.addEventListener('click', () => {
      modal.classList.remove('show');
      editId = null;
      validator.reset();
    });

    teamForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const validation = validator.validate();
      if (!validation.valid) return;

      const data = {
        name: document.getElementById('tm-name').value.trim(),
        title: document.getElementById('tm-title').value.trim(),
        image: document.getElementById('tm-image').value.trim(),
        order: parseInt(document.getElementById('tm-order').value) || 0,
        bio: document.getElementById('tm-bio').value.trim()
      };

      let result;
      if (editId) {
        result = await updateDocument('team_members', editId, data);
      } else {
        result = await addDocument('team_members', data);
      }

      if (result.success) {
        modal.classList.remove('show');
        editId = null;
        await loadTeam();
      }
    });

    async function loadTeam() {
      showLoadingSkeleton(tbody, 3, 5);
      allMembers = await getCollection('team_members', 'order', 'asc');
      currentPage = 1;
      renderTable();
    }

    loadTeam();
  </script>
</body>
</html>
