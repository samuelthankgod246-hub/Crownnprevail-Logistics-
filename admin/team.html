<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team — CrownPrevail Admin</title>
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../assets/images/logo/logo plain background.png" alt="CrownPrevail">
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">📊</span><span>Dashboard</span></a>
        <a href="blogs.html"><span class="icon">📝</span><span>Blog Posts</span></a>
        <a href="inquiries.html"><span class="icon">✉️</span><span>Inquiries</span></a>
        <a href="team.html" class="active"><span class="icon">👥</span><span>Team</span></a>
        <a href="analytics.html"><span class="icon">📈</span><span>Analytics</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank"><span class="icon">🌐</span><span>View Site</span></a>
        <a href="#" id="logout-link"><span class="icon">🚪</span><span>Sign Out</span></a>
      </div>
    </aside>

    <main class="main-content" id="admin-content">
      <div class="top-bar">
        <h2>Team Members</h2>
        <button class="btn btn-gold" style="width:auto;" id="add-member-btn">+ Add Member</button>
      </div>

      <div id="alert-message" class="alert"></div>

      <div class="card">
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Name</th>
                  <th>Title</th>
                  <th>Image Path</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="team-tbody">
                <tr><td colspan="5" class="loading"><div class="spinner" style="margin:0 auto 8px;"></div>Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Edit Modal -->
      <div class="modal-overlay" id="team-modal">
        <div class="modal">
          <h3 id="modal-title">Add Team Member</h3>
          <form id="team-form">
            <div class="form-row">
              <div class="form-group">
                <label for="tm-name">Full Name</label>
                <input type="text" id="tm-name" required>
              </div>
              <div class="form-group">
                <label for="tm-title">Title / Position</label>
                <input type="text" id="tm-title" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="tm-image">Image Path</label>
                <input type="text" id="tm-image" placeholder="assets/team/name.jpg">
              </div>
              <div class="form-group">
                <label for="tm-order">Display Order</label>
                <input type="number" id="tm-order" value="0" min="0">
              </div>
            </div>
            <div class="form-group">
              <label for="tm-bio">Bio</label>
              <textarea id="tm-bio" rows="3"></textarea>
            </div>
            <div class="form-actions" style="border:none;padding:0;margin-top:20px;">
              <button type="button" class="btn btn-outline" id="modal-cancel-btn">Cancel</button>
              <button type="submit" class="btn btn-gold" style="width:auto;" id="modal-save-btn">Save</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, getCollection, addDocument, updateDocument, deleteDocument, logoutAdmin } from './assets/admin.js';
    requireAuth();

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      logoutAdmin();
    });

    const tbody = document.getElementById('team-tbody');
    const modal = document.getElementById('team-modal');
    const modalTitle = document.getElementById('modal-title');
    const teamForm = document.getElementById('team-form');
    const saveBtn = document.getElementById('modal-save-btn');
    const cancelBtn = document.getElementById('modal-cancel-btn');
    const alertEl = document.getElementById('alert-message');
    let editId = null;

    async function loadTeam() {
      const members = await getCollection('team_members');
      members.sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
      if (members.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:40px;">No team members yet.</td></tr>';
        return;
      }
      tbody.innerHTML = members.map(m => `
        <tr>
          <td>${m.order ?? '—'}</td>
          <td><strong>${m.name}</strong></td>
          <td>${m.title}</td>
          <td style="font-size:12px;color:#888;">${m.image || '—'}</td>
          <td>
            <div class="actions">
              <button class="btn btn-sm btn-outline edit-btn" data-id="${m.id}" data-name="${m.name.replace(/"/g,'&quot;')}" data-title="${(m.title||'').replace(/"/g,'&quot;')}" data-image="${m.image||''}" data-order="${m.order??''}" data-bio="${(m.bio||'').replace(/"/g,'&quot;')}">Edit</button>
              <button class="btn btn-sm btn-danger delete-btn" data-id="${m.id}" data-name="${m.name.replace(/"/g,'&quot;')}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => openEdit(btn.dataset));
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (confirm(`Delete ${btn.dataset.name}?`)) {
            await deleteDocument('team_members', btn.dataset.id);
            loadTeam();
          }
        });
      });
    }

    function openEdit(data) {
      editId = data.id || null;
      modalTitle.textContent = editId ? 'Edit Team Member' : 'Add Team Member';
      saveBtn.textContent = editId ? 'Update' : 'Save';
      document.getElementById('tm-name').value = data.name || '';
      document.getElementById('tm-title').value = data.title || '';
      document.getElementById('tm-image').value = data.image || '';
      document.getElementById('tm-order').value = data.order || '0';
      document.getElementById('tm-bio').value = data.bio || '';
      modal.classList.add('show');
    }

    document.getElementById('add-member-btn').addEventListener('click', () => {
      editId = null;
      teamForm.reset();
      document.getElementById('tm-order').value = '0';
      modalTitle.textContent = 'Add Team Member';
      saveBtn.textContent = 'Save';
      modal.classList.add('show');
    });

    cancelBtn.addEventListener('click', () => {
      modal.classList.remove('show');
      editId = null;
    });

    teamForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('tm-name').value.trim(),
        title: document.getElementById('tm-title').value.trim(),
        image: document.getElementById('tm-image').value.trim(),
        order: parseInt(document.getElementById('tm-order').value) || 0,
        bio: document.getElementById('tm-bio').value.trim()
      };
      let result;
      if (editId) {
        result = await updateDocument('team_members', editId, data);
      } else {
        result = await addDocument('team_members', data);
      }
      if (result.success) {
        modal.classList.remove('show');
        editId = null;
        loadTeam();
      } else {
        alert('Error: ' + result.error);
      }
    });

    loadTeam();
  </script>
</body>
</html>
