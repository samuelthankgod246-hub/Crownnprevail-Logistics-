<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts — CrownPrevail Admin</title>
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/assets/images/logo/logo plain background.png" alt="CrownPrevail">
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" aria-label="Dashboard"><span class="icon"><i class="fas fa-chart-line"></i></span><span>Dashboard</span></a>
        <a href="blogs.html" class="active" aria-label="Blog Posts"><span class="icon"><i class="fas fa-pen-fancy"></i></span><span>Blog Posts</span></a>
        <a href="inquiries.html" aria-label="Inquiries"><span class="icon"><i class="fas fa-envelope"></i></span><span>Inquiries</span></a>
        <a href="team.html" aria-label="Team"><span class="icon"><i class="fas fa-users"></i></span><span>Team</span></a>
        <a href="analytics.html" aria-label="Analytics"><span class="icon"><i class="fas fa-chart-bar"></i></span><span>Analytics</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank" aria-label="View Website"><span class="icon"><i class="fas fa-globe"></i></span><span>View Site</span></a>
        <a href="#" id="logout-link" aria-label="Sign Out"><span class="icon"><i class="fas fa-sign-out-alt"></i></span><span>Sign Out</span></a>
      </div>
    </aside>

    <main class="main-content" id="admin-content">
      <div class="top-bar">
        <h2>Blog Posts</h2>
        <a href="blog-edit.html" class="btn btn-gold" style="width:auto;"><i class="fas fa-plus"></i> New Post</a>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Slug</th>
                  <th>Author</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="blog-table-body">
                <tr><td colspan="6" class="loading"><div class="spinner" style="margin:0 auto 8px;"></div>Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <h3>Delete Post</h3>
      <p>Are you sure you want to delete "<span id="delete-post-title"></span>"? This cannot be undone.</p>
      <div class="form-actions" style="border:none;padding:0;margin-top:20px;">
        <button class="btn btn-outline" id="delete-cancel-btn">Cancel</button>
        <button class="btn btn-danger" id="delete-confirm-btn">Delete</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, getCollection, formatDate, deleteDocument, logoutAdmin } from './assets/admin.js';
    import { toastManager } from './assets/utils.js';
    
    requireAuth();

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm('Are you sure you want to sign out?')) {
        logoutAdmin();
      }
    });

    let deleteTargetId = null;
    const tbody = document.getElementById('blog-table-body');
    const modal = document.getElementById('delete-modal');
    const deleteTitle = document.getElementById('delete-post-title');
    const deleteCancel = document.getElementById('delete-cancel-btn');
    const deleteConfirm = document.getElementById('delete-confirm-btn');

    async function loadBlogs() {
      const blogs = await getCollection('blog_posts', 'createdAt', 'desc');
      if (blogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="icon">📝</div><p>No blog posts yet. <a href="blog-edit.html" style="color:#a68f50;">Create your first post →</a></p></div></td></tr>';
        return;
      }
      tbody.innerHTML = blogs.map(post => `
        <tr>
          <td><strong>${post.title}</strong></td>
          <td style="font-size:12px;color:#888;">${post.slug}</td>
          <td>${post.author || 'Admin'}</td>
          <td><span class="status ${post.published ? 'status-published' : 'status-draft'}">${post.published ? 'Published' : 'Draft'}</span></td>
          <td style="font-size:13px;">${formatDate(post.createdAt)}</td>
          <td>
            <div class="actions">
              <a href="blog-edit.html?id=${post.id}" class="btn btn-sm btn-outline"><i class="fas fa-edit"></i> Edit</a>
              <button class="btn btn-sm btn-danger" data-id="${post.id}" data-title="${post.title.replace(/"/g,'&quot;')}"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');

      document.querySelectorAll('[data-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          deleteTargetId = btn.dataset.id;
          deleteTitle.textContent = btn.dataset.title;
          modal.classList.add('show');
        });
      });
    }

    deleteCancel.addEventListener('click', () => {
      modal.classList.remove('show');
      deleteTargetId = null;
    });

    deleteConfirm.addEventListener('click', async () => {
      if (!deleteTargetId) return;
      const result = await deleteDocument('blog_posts', deleteTargetId);
      if (result.success) {
        modal.classList.remove('show');
        deleteTargetId = null;
        loadBlogs();
      } else {
        alert('Error deleting post: ' + result.error);
      }
    });

    loadBlogs();
  </script>
</body>
</html>
