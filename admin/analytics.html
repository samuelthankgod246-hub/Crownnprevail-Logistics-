<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — CrownPrevail Admin</title>
  <link rel="stylesheet" href="assets/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../assets/images/logo/logo plain background.png" alt="CrownPrevail">
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">📊</span><span>Dashboard</span></a>
        <a href="blogs.html"><span class="icon">📝</span><span>Blog Posts</span></a>
        <a href="inquiries.html"><span class="icon">✉️</span><span>Inquiries</span></a>
        <a href="team.html"><span class="icon">👥</span><span>Team</span></a>
        <a href="analytics.html" class="active"><span class="icon">📈</span><span>Analytics</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank"><span class="icon">🌐</span><span>View Site</span></a>
        <a href="#" id="logout-link"><span class="icon">🚪</span><span>Sign Out</span></a>
      </div>
    </aside>

    <main class="main-content" id="admin-content">
      <div class="top-bar">
        <h2>Analytics</h2>
      </div>

      <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="stat-card"><div class="stat-icon">📬</div><div class="stat-number" id="total-all">—</div><div class="stat-label">Total Submissions</div></div>
        <div class="stat-card"><div class="stat-icon">📝</div><div class="stat-number" id="total-blogs">—</div><div class="stat-label">Blog Posts</div></div>
        <div class="stat-card"><div class="stat-icon">👤</div><div class="stat-number" id="total-team">—</div><div class="stat-label">Team Members</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div class="card">
          <div class="card-header"><h3>Submissions by Type</h3></div>
          <div class="card-body"><canvas id="typeChart" height="250"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Submission Trends</h3></div>
          <div class="card-body"><canvas id="trendChart" height="250"></canvas></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, getCollection, getCount, formatDate, logoutAdmin } from './assets/admin.js';
    requireAuth();

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      logoutAdmin();
    });

    async function loadAnalytics() {
      const [contacts, quotes, subs, tracking, comments, blogs, team] = await Promise.all([
        getCollection('contact_inquiries', 'createdAt'),
        getCollection('quote_requests', 'createdAt'),
        getCollection('newsletter_subscriptions', 'createdAt'),
        getCollection('tracking_inquiries', 'createdAt'),
        getCollection('blog_comments', 'createdAt'),
        getCount('blog_posts'),
        getCount('team_members')
      ]);

      const total = contacts.length + quotes.length + subs.length + tracking.length + comments.length;
      document.getElementById('total-all').textContent = total;
      document.getElementById('total-blogs').textContent = blogs;
      document.getElementById('total-team').textContent = team;

      // ── Pie Chart ──
      new Chart(document.getElementById('typeChart'), {
        type: 'doughnut',
        data: {
          labels: ['Contact ('+contacts.length+')', 'Quotes ('+quotes.length+')', 'Newsletter ('+subs.length+')', 'Tracking ('+tracking.length+')', 'Comments ('+comments.length+')'],
          datasets: [{
            data: [contacts.length, quotes.length, subs.length, tracking.length, comments.length],
            backgroundColor: ['#3b82f6','#a68f50','#16a34a','#f59e0b','#8b5cf6']
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });

      // ── Trend Chart (last 7 days) ──
      const allItems = [...contacts, ...quotes, ...subs, ...tracking, ...comments];
      const days = {};
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        days[key] = 0;
      }
      allItems.forEach(item => {
        if (item.createdAt) {
          const d = item.createdAt.toDate ? item.createdAt.toDate() : new Date(item.createdAt);
          const key = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          if (days[key] !== undefined) days[key]++;
        }
      });

      new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels: Object.keys(days),
          datasets: [{
            label: 'Submissions',
            data: Object.values(days),
            borderColor: '#a68f50',
            backgroundColor: 'rgba(166,143,80,0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
      });
    }

    loadAnalytics();
  </script>
</body>
</html>
